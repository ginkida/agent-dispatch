name: Publish to PyPI

on:
  release:
    types: [published]

# Default to no privileges; the publish job opts into exactly what it needs.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publisher
      contents: read    # checkout the tagged source
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build
          python -m build

      # Keep this current with the build backend. The pinned action bundles its
      # own twine, and twine rejects a Metadata-Version it does not know: the
      # v0.13.0 publish failed because hatchling 1.32 emits `Metadata-Version:
      # 2.5` while the previous pin (Feb 2026) shipped twine 6.1.0 / packaging
      # 25.0. `python -m build` resolves the newest hatchling at build time, so
      # this drifts on its own with no repo change — see the release checklist's
      # `twine check` step, which catches it before a tag is cut.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
